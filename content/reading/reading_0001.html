<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>华夏小书房 · 第1篇</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="reading.css">
</head>
<body>

<div class="article-header">
  <h1 id="article-title">数学里的故事</h1>

  <div class="article-actions">
    <button id="btnRead">🔊 AI朗读本页</button>
    <button id="btnStop">⏹ 停止朗读</button>
    <button id="toggleMode">切换阅读模式</button>   <!-- ⭐ 放这里 -->
    <button id="toggleNight">🌙 夜间模式</button>
    <button id="toggleEye">👀 护眼模式</button>
    <button id="fontPlus">A+</button>
    <button id="fontMinus">A-</button>
  </div>
  <!-- 📤 GitHub 阅读进度同步 -->
  <button id="btnSync">📤 同步阅读进度到 GitHub</button>
  <div id="sync-qrcode"></div>
</div>

<script>
  //const ARTICLE_ID = 'reading_0001';  // ← 每篇文章唯一 ID
  // ⭐ 每篇文章必须不同
  const ARTICLE_ID = location.pathname.split("/").pop().replace(".html", "");
  // ⭐ 自动从页面标题读取文章名
  const ARTICLE_TITLE = document.getElementById("article-title").innerText;

  // ⭐ 写入最近阅读记录
  const history = JSON.parse(localStorage.getItem("reading_history") || "[]");

  history.unshift({
    id: ARTICLE_ID,
    title: ARTICLE_TITLE,
    time: Date.now()
  });

  localStorage.setItem("reading_history", JSON.stringify(history));

  // ⭐ 写入阅读时长（示例：每 5 秒累加）
  let seconds = 0;
  setInterval(() => {
    seconds++;
    localStorage.setItem(`reading_time_${ARTICLE_ID}`, seconds);
  }, 1000);
</script>

<!-- ⭐ 顶部进度条（必须有） -->
<div id="progress-bar">
  <div id="progress-inner"></div>
</div>

<!-- ⭐ 分页按钮（分页模式才显示） -->
<div id="pagedControls" class="paged-controls" style="display:none;">
  <button id="prevPageBtn">⬅ 上一页</button>
  <span id="pageInfo">第 1 / 1 页</span>
  <button id="nextPageBtn">下一页 ➡</button>
</div>

<!-- 正文内容（自动分页） -->
<article id="articleContent" class="article-content">
  <p>在很久很久以前，数学并不是考试题，而是人类理解世界的语言。</p>
  <p>人们用数学描述星空、河流、建筑、贸易，甚至人与人之间的关系。</p>
  <p>数学是一种故事，一种逻辑的故事，一种世界如何运作的故事。</p>
  <p>后来，数学变成了考试题，但它的本质从未改变。</p>
  <p>它依然是人类最古老、最深刻的语言之一。</p>
  <p>当我们重新用“故事”的方式理解数学，它就变得不再枯燥。</p>
  <p>它变成了一个个有趣的谜题，一段段优雅的推理。</p>
  <p>数学不是难，而是美。</p>
</article>
<div class="rating-box">
  <div class="rating-stars" data-article-id="reading_0001">
  </div>
  <div class="rating-text">点击星星评分</div>
</div>
